[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshcfg-audit"
version = "1.1.0"
description = "Offline auditor for sshd_config and ssh client config: follows Include files, checks Match blocks, JSON output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["ssh", "sshd", "openssh", "hardening"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/sshcfg-audit"

[project.scripts]
sshcfg-audit = "sshcfg_audit:main"

[tool.setuptools]
py-modules = ["sshcfg_audit"]
